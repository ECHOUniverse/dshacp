# DSHACP: Zed-first ACP v1 server over DeepSeek Harness.
#
# This leaf config holds ONLY DSHACP-owned rows. The rest of the process
# composition comes from two patch layers applied by `lib/bin.js` through
# boot()'s patches parameter, in this order:
#
#   1. dsh-base/cordis.patch.yml  — the shared host core: registries (llm,
#      session, agent, tools, skills, goals, subagents, workflow, jobs),
#      sandbox + approval + permission presets, persistence/compaction/spill,
#      every model-facing tool row, and the llm-deepseek adapter.
#   2. dshacp.patch.yml           — the web-app-style disable list (the
#      base's agent-plane tool rows move behind agent presets), the DSHACP
#      persona, per-project persistence, HMR disabled.
#
# The result is a thin ACP bridge over DSH's own configured surface: skills,
# tools, MCP, plugin user-tools, and the standard/cordis/code/minimal modes
# are inherited from DSH instead of re-implemented (DESIGN §12). This process
# has no stdout logger and no HMR because stdout carries ACP JSON-RPC; all
# diagnostics go to stderr. The bin loads the gitignored root `.env` (and the
# DSH home `.env` via dsh-app-boot) before this config.

# The preset roster: each ACP session composes its agent from one preset
# (standard / cordis / code / minimal), mounted ONCE per preset under a
# standing scope. `default` is the mode a session starts in; the ACP
# `mode` config option can switch a blank session (DESIGN D9). The shipped
# root is the dsh installation's `config/agent-presets`, exposed to this
# expression by lib/bin.js at boot; `~/.dsh/.agent-presets` (user trust) is
# appended automatically.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    roots:
      - path: !!js ctx.shippedPresetRoot
        trust: system

# P2-2: remote SSH operations (engine + model tools + prompt announcement).
# The app provides a no-op `webServer` stub because this process serves no
# HTTP; host management and the web terminal stay in the DSH web app. Hosts
# are configured by the user in ~/.dsh/dsh-ssh.json (shared with the web app).
- id: ssh
  name: '@linxin666/dsh-ssh'
  config:
    announceToAgent: true
    enabled: true

# The DSHACP app: the widened ACP bridge over the base composition. Sessions,
# streaming, approval, config options (model / thinking / mode), slash
# commands, MCP forwarding, and elicitation all live in lib/index.js.
- id: dshacp
  name: './lib/index.js'
  config:
    # How long a pushed permission request waits for the client before
    # rejecting (fail-closed, DESIGN §7).
    approvalTimeoutMs: 600000
    # How long an elicitation (ask_user_question) waits for the user before
    # failing the tool call closed (P4b).
    elicitationTimeoutMs: 1800000
    # P3 hybrid mode (opt-in): with DSHACP_HYBRID=1 AND a client that
    # advertises fs.writeTextFile (Zed does), the `write` tool delegates to
    # the client editor so Zed offers per-hunk diff review.
    hybridFileWrites: !!js "process.env.DSHACP_HYBRID === '1'"

# The host-side Cordis plugin runner: provides `dynamicCordisRunner` +
# `cordisInspect`, the services the `cordis` agent preset's `tool-cordis`
# row waits for (创造模式 — read the live runtime, mount a temporary plugin,
# author presets). It depends only on the host `tools` registry, so it is
# headless-safe; without it the `cordis` preset fails to mount and the mode
# is unselectable. The same row the web app mounts.
- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'

# DSHACP: Zed-first ACP v1 server over DeepSeek Harness. This composition has
# no stdout logger and no HMR because stdout carries ACP JSON-RPC; all
# diagnostics go to stderr. The bin loads the gitignored root `.env` (and the
# DSH home `.env` via dsh-app-boot) before this config.

# The DeepSeek adapter. `session/new` may override provider/model through the
# app config; omitted agentOptions reuse these defaults.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Reuse ~/.dsh machine credentials (.credentials.yaml) and the user settings
# document when present; both are optional.
- id: credentials-local
  name: '@deepseek-ai/dsh-credentials-local'

- id: settings-file
  name: '@deepseek-ai/dsh-settings-file'

# The default composition confines bash AND the filesystem tools to the
# workspace and asks before a wider retry; DSH_PERMISSION_MODE provides an
# explicit deployment override (e.g. danger-full-access). The sandbox default
# + fallback root live on ctx.sandboxPolicy; agent calls resolve both families
# against the session cwd.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# The DSHACP app: agent spine + JSONL persistence + widened ACP bridge.
# Persistence root defaults to ./.sessions; DSH_SESSIONS_ROOT overrides it
# (Zed launches the server from the project root).
- id: dshacp
  name: './lib/index.js'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    persistenceRoot: !!js "process.env.DSH_SESSIONS_ROOT ?? './.sessions'"
    # P3 hybrid mode (opt-in): with DSHACP_HYBRID=1 AND a client that
    # advertises fs.writeTextFile (Zed does), the `write` tool delegates to the
    # client editor so Zed offers per-hunk diff review.
    hybridFileWrites: !!js "process.env.DSHACP_HYBRID === '1'"
    workspaceContext:
      maxBytes: 65536
    # Keep the persona to identity and behavior; tool plugins own tool guidance.
    # The loop resolves {{model}} and each ACP session's client-supplied {{cwd}}.
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

# Replay-aware request pressure; the routed adapter supplies model capacity.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Summarize an older range after measured pressure or a canonical provider overflow.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: subagent catalog identity (mode/label) folds through
# its registered units; the catalog surfaces (list_agents, subagent listing)
# fail loud without the capability.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through separate tool
# names so multi-child scenarios exercise both transports.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control package registers the global `send_message`; its
# list plugin registers `list_agents`, served through the sessionProjections
# registry mounted above. `report` is installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend; the adjacent tool exposes it to the model.
- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'

# `todo_write` replaces the logged whole list for later model requests.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Identical repeat calls trigger advisory context, never a block.
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

# The filesystem stack rides the SAME sandbox policy as bash: dsh-fs-sandbox
# replaces dsh-fs-local behind ctx.fs and fences write/edit by the effective
# mode, so read/write/edit are available under every mode. fs-observation-policy
# (read-before-edit) composes orthogonally on top.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# P2-2: remote SSH operations (engine + model tools + prompt announcement).
# The app provides a no-op `webServer` stub because this process serves no
# HTTP; host management and the web terminal stay in the DSH web app. Hosts
# are configured by the user in ~/.dsh/dsh-ssh.json (shared with the web app).
- id: ssh
  name: '@linxin666/dsh-ssh'
  config:
    announceToAgent: true
    enabled: true
